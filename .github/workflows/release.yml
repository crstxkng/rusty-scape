name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_itch:
        description: "Push the builds to itch.io"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.channel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: linux
            os: ubuntu-latest
          - channel: windows
            os: windows-latest
          - channel: mac
            os: macos-latest
          - channel: html5
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.channel == 'html5' && 'wasm32-unknown-unknown' || matrix.channel == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.channel }}

      - name: Install Linux dependencies
        if: matrix.channel == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Build (Linux)
        if: matrix.channel == 'linux'
        run: scripts/build-native.sh

      - name: Build (Windows)
        if: matrix.channel == 'windows'
        shell: bash
        run: scripts/build-native.sh

      - name: Build (macOS universal .app)
        if: matrix.channel == 'mac'
        run: scripts/bundle-macos.sh

      - name: Build (Web)
        if: matrix.channel == 'html5'
        run: scripts/build-web.sh

      - name: Collect output
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.channel }}" in
            html5) mv dist/web out/rusty-scape-html5 ;;
            *) mv "dist/${{ matrix.channel }}" "out/rusty-scape-${{ matrix.channel }}" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: rusty-scape-${{ matrix.channel }}
          path: out/rusty-scape-${{ matrix.channel }}

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_itch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Repository secret holding an itch.io API key (https://itch.io/user/settings/api-keys).
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY || secrets.BUTLER_CREDENTIALS }}
      # "<itch-username>/<game-slug>". Override with an ITCH_GAME repository variable.
      ITCH_GAME: ${{ vars.ITCH_GAME || secrets.ITCH_GAME || 'cracking/rusty-scape' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Restore executable bits
        run: |
          # upload-artifact drops file permissions.
          chmod +x builds/rusty-scape-linux/rusty-scape
          chmod +x "builds/rusty-scape-mac/Rusty Scape.app/Contents/MacOS/rusty-scape"
          ls -R builds | head -50

      - name: Push to itch.io with butler
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::BUTLER_API_KEY secret is not set. Create an API key at https://itch.io/user/settings/api-keys and add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          # Accept either "user/game" or a page URL like "https://user.itch.io/game".
          ITCH_GAME=$(echo "$ITCH_GAME" | tr -d '[:space:]' | sed -E 's#^(https?://)?([^./]+)\.itch\.io/([^/?#]+).*#\2/\3#')
          case "$ITCH_GAME" in
            */*) ;;
            *) echo "::error::ITCH_GAME must look like user/game, got '$ITCH_GAME'"; exit 1 ;;
          esac
          echo "Publishing to https://${ITCH_GAME%%/*}.itch.io/${ITCH_GAME#*/}"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          for channel in linux windows mac html5; do
            dir="builds/rusty-scape-$channel"
            ./butler/butler push "$dir" "$ITCH_GAME:$channel" --userversion "$VERSION"
          done

      - name: Zip for GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          for channel in linux windows mac html5; do
            dir="builds/rusty-scape-$channel"
            (cd "$dir" && zip -qry "$GITHUB_WORKSPACE/release/rusty-scape-$channel.zip" .)
          done

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
