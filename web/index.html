<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#211f4d">
    <title>Rusty Scape</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <script src="mq_js_bundle.js"></script>
    <script>
        // Persists high scores and settings in localStorage and exposes
        // phone vibration (see src/storage.rs).
        miniquad_add_plugin({
            name: "rusty_scape_storage",
            version: 1,
            register_plugin: function (importObject) {
                importObject.env.rusty_scape_storage_get = function (slot) {
                    try {
                        var v = window.localStorage.getItem("rusty-scape:" + slot);
                        return v === null ? NaN : parseFloat(v);
                    } catch (e) {
                        return NaN;
                    }
                };
                importObject.env.rusty_scape_storage_set = function (slot, value) {
                    try {
                        window.localStorage.setItem("rusty-scape:" + slot, String(value));
                    } catch (e) { /* storage blocked (private mode / sandboxed iframe) */ }
                };
                importObject.env.rusty_scape_vibrate = function (ms) {
                    try {
                        if (navigator.vibrate) navigator.vibrate(ms);
                    } catch (e) { /* not supported */ }
                };
            }
        });
        load("rusty-scape.wasm");
        // Grab keyboard focus so arrow keys work immediately inside the itch.io iframe.
        // (mq_js_bundle.js already declares a global named `canvas`.)
        var gameCanvas = document.getElementById("glcanvas");
        gameCanvas.focus();
        window.addEventListener("pointerdown", function () { gameCanvas.focus(); });
        // Block the long-press menu and pinch/double-tap zoom on phones.
        gameCanvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    </script>
</body>
</html>
