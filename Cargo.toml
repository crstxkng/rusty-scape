[package]
name = "rusty-scape"
version = "0.2.0"
edition = "2021"
description = "Dodge the falling blocks! A tiny arcade game built with macroquad."
license-file = "LICENSE"

[dependencies]
# Pinned exactly: web/mq_js_bundle.js must match the miniquad version macroquad uses.
macroquad = { version = "=0.4.14", default-features = false, features = ["audio"] }

[profile.release]
# Note: keep the default panic=unwind. quad-snd panics on its own thread when a
# machine has no audio device; unwinding keeps the game running silently.
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
